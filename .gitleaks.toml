title = "platform-ops gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow known placeholder/example values and a Prometheus label matcher that reads like a key"
regexes = [
  '''CHANGE_ME_[A-Z0-9_]+''',
  '''REQUIRED_SET_BY_DEPLOY''',
  '''dummy''',
  '''redpanda_topic=''',
]

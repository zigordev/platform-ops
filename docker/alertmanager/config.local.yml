# Local Alertmanager.
#
# Same route shape as prod, deliberately: severities that only exist in one
# environment are severities whose routing is never exercised until it matters.
# The receivers differ because sending real email from a laptop is noise —
# locally an alert is something you look at in the Alertmanager UI at :9093.
#
# The previous version posted to http://host.docker.internal:5001/alerts, where
# nothing has ever listened. `null` is honest about that; the UI still shows
# every firing alert, which is the thing you actually want locally.

global:
  resolve_timeout: 5m

route:
  receiver: local-sink
  group_by: ['environment', 'alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="page"
      receiver: local-sink
      group_wait: 10s
    - matchers:
        - severity="ticket"
      receiver: local-sink
      group_wait: 1m

inhibit_rules:
  # A service that is down cannot also be usefully described as unhealthy,
  # degraded, missing a health signal or burning its error budget. One outage
  # should be one email, not five.
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - alertname=~"ServiceUnhealthy|ServiceDegraded|ComponentDown|HealthSignalMissing|AvailabilityBudget.*|LatencyBudget.*|ErrorLogsSpiking"
    equal: ['environment', 'job']

  # The broker being down is why the consumers are behind and why the
  # dead-letter topic is growing.
  - source_matchers:
      - alertname="RedpandaDown"
    target_matchers:
      - alertname=~"KafkaConsumerLagGrowing|DeadLetterQueueGrowing"
    equal: ['environment']

  # A disk that is already critical does not need the two alerts that predicted
  # it would be.
  - source_matchers:
      - alertname="HostDiskCritical"
    target_matchers:
      - alertname=~"HostDiskFillingUp|HostFilesystemWillFillIn24h"
    equal: ['environment', 'instance']

  # Same alert, same service, both severities: the page is the one to answer.
  - source_matchers:
      - severity="page"
    target_matchers:
      - severity="ticket"
    equal: ['environment', 'alertname', 'job']

receivers:
  - name: local-sink

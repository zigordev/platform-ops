# Local Alertmanager.
#
# Same route shape as prod, deliberately: severities that only exist in one
# environment are severities whose routing is never exercised until it matters.
# The receivers differ because sending real email from a laptop is noise —
# locally an alert is something you look at in the Alertmanager UI at :9093.
#
# The previous version posted to http://host.docker.internal:5001/alerts, where
# nothing has ever listened. `null` is honest about that; the UI still shows
# every firing alert, which is the thing you actually want locally.

global:
  resolve_timeout: 5m

route:
  receiver: local-sink
  group_by: ['environment', 'alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="page"
      receiver: local-sink
      group_wait: 10s
    - matchers:
        - severity="ticket"
      receiver: local-sink
      group_wait: 1m

inhibit_rules:
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - alertname=~"ServiceUnhealthy|ServiceDegraded|ComponentDown|HealthSignalMissing|AvailabilityBudget.*|LatencyBudget.*|ErrorLogsSpiking|PageLatencyBudget.*|AskSlow|AskUpstreamFailing|ContactPublishFailing|PoolsSync.*|TeamInvitationsNotQueued|NotificationsConsumerStuck|NotificationsReceivedButNotSent|EmailDeliveryBudget.*"
    equal: ['environment', 'job']
  - source_matchers:
      - alertname="ServiceUnhealthy"
    target_matchers:
      - alertname=~"NotificationsConsumerStuck|NotificationsReceivedButNotSent|EmailDeliveryBudget.*"
    equal: ['environment', 'job']

  - source_matchers:
      - alertname="RedpandaDown"
    target_matchers:
      - alertname=~"KafkaConsumerLagGrowing|DeadLetterQueueGrowing|NotificationsConsumerStuck|NotificationsReceivedButNotSent|ContactPublishFailing|TeamInvitationsNotQueued"
    equal: ['environment']
  - source_matchers:
      - alertname="RedpandaDown"
    target_matchers:
      - alertname="ServiceDown"
    equal: ['environment', 'job']

  - source_matchers:
      - alertname="HostDiskCritical"
    target_matchers:
      - alertname=~"HostDiskFillingUp|HostFilesystemWillFillIn24h"
    equal: ['environment', 'instance']

  - source_matchers:
      - severity="page"
    target_matchers:
      - severity="ticket"
    equal: ['environment', 'alertname', 'job']

receivers:
  - name: local-sink

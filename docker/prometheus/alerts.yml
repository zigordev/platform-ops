# Alerting rules for the estate.
#
# Two severities, and they map exactly onto the Alertmanager routes:
#
#   severity: page    — something is broken now, or the error budget is being
#                       spent fast enough to be gone within days. Goes to email
#                       immediately.
#   severity: ticket  — real, but it can wait for the next working session.
#                       Grouped and sent less often.
#
# There is no third severity. The previous ruleset had one alert labelled
# `critical`, which matched no route at all and fell through to the default
# receiver — a "critical" alert that was quietly the least urgent thing in the
# file. Every label below is one of the two the routing knows about.
#
# Every alert carries a runbook_url, and every one of those URLs resolves to a
# file in docs/runbooks/. An alert that links to a 404 is worse than an alert
# with no link: it promises help that is not there.

groups:
  # ===========================================================================
  # SLO burn rate.
  #
  # The SLO is 99.5% availability, so the error budget is 0.5% of requests. Burn
  # rate is how fast that budget is being spent relative to spending it evenly
  # over 30 days: 1x means it runs out exactly at the end of the window, 14.4x
  # means it is gone in roughly two days.
  #
  # Each alert pairs a long window with a short one. The long window says the
  # budget is genuinely being burned; the short window says it is *still*
  # burning right now. Requiring both is what stops a brief spike paging you an
  # hour after it recovered — the classic failure of a single-threshold alert,
  # and the reason the two rules this replaces were unreliable enough to ignore.
  # ===========================================================================
  - name: slo_availability_burn
    rules:
      - alert: AvailabilityBudgetBurningFast
        # 14.4x over 1h: the month's budget is gone in about two days.
        expr: |
          (1 - slo:availability:ratio_rate1h) > (14.4 * 0.005)
          and
          (1 - slo:availability:ratio_rate5m) > (14.4 * 0.005)
          and
          slo:traffic:rate1h > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} is burning its availability budget 14x too fast'
          description: >-
            Over the last hour {{ $labels.job }} returned enough 5xx responses to
            exhaust a 30-day error budget in about two days, and it is still
            failing now. The 99.5% SLO will be missed within days if this holds.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/availability-burn.md'
          dashboard: 'service-overview'

      - alert: AvailabilityBudgetBurning
        # 6x over 6h: the budget is gone in about five days.
        expr: |
          (1 - slo:availability:ratio_rate6h) > (6 * 0.005)
          and
          (1 - slo:availability:ratio_rate30m) > (6 * 0.005)
          and
          slo:traffic:rate6h > 0.05
        for: 15m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} is burning its availability budget 6x too fast'
          description: >-
            Sustained 5xx responses from {{ $labels.job }} over six hours. Slower
            than the 14x alert, but still fast enough to miss the SLO this month.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/availability-burn.md'
          dashboard: 'service-overview'

      - alert: AvailabilityBudgetErodingSlowly
        # 3x over a day: worth a look, not worth an interruption.
        expr: |
          (1 - slo:availability:ratio_rate1d) > (3 * 0.005)
          and
          (1 - slo:availability:ratio_rate2h) > (3 * 0.005)
          and
          slo:traffic:rate1d > 0.05
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} has been failing steadily for a day'
          description: >-
            A low but persistent 5xx rate on {{ $labels.job }}. Nothing is on
            fire; something is wrong and has been for hours.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/availability-burn.md'
          dashboard: 'service-overview'

  - name: slo_latency_burn
    rules:
      - alert: LatencyBudgetBurningFast
        expr: |
          (1 - slo:latency:ratio_rate1h) > (14.4 * 0.05)
          and
          (1 - slo:latency:ratio_rate5m) > (14.4 * 0.05)
          and
          slo:traffic:rate1h > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} is far slower than its 500ms target'
          description: >-
            Well over 5% of requests to {{ $labels.job }} are taking longer than
            500ms, and have been for an hour. The SLO allows 5%; this is
            fourteen times that rate.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/latency-burn.md'
          dashboard: 'service-overview'

      - alert: LatencyBudgetEroding
        expr: |
          (1 - slo:latency:ratio_rate6h) > (6 * 0.05)
          and
          (1 - slo:latency:ratio_rate30m) > (6 * 0.05)
          and
          slo:traffic:rate6h > 0.05
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is consistently slow'
          description: >-
            {{ $labels.job }} has been missing the 500ms target for a meaningful
            share of requests over six hours.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/latency-burn.md'
          dashboard: 'service-overview'

  - name: slo_page_latency_burn
    rules:
      - alert: PageLatencyBudgetBurningFast
        expr: |
          (1 - slo:page_latency:ratio_rate1h) > (14.4 * 0.05)
          and
          (1 - slo:page_latency:ratio_rate5m) > (14.4 * 0.05)
          and
          slo:page_traffic:rate1h * 3600 >= 20
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is rendering pages far slower than half a second'
          description: >-
            Most page renders of {{ $labels.job }} in the last hour took longer
            than half a second, and they still do. The objective is 95% under
            half a second; this burns a month's budget in about two days.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/page-latency.md'
          dashboard: 'service-overview'

      - alert: PageLatencyBudgetEroding
        expr: |
          (1 - slo:page_latency:ratio_rate6h) > (6 * 0.05)
          and
          (1 - slo:page_latency:ratio_rate30m) > (6 * 0.05)
          and
          slo:page_traffic:rate6h * 3600 >= 20
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} has been rendering pages slowly for hours'
          description: >-
            Nearly a third of page renders of {{ $labels.job }} over six hours
            took longer than half a second.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/page-latency.md'
          dashboard: 'service-overview'

  # ===========================================================================
  # Availability of the services themselves.
  #
  # `up` and `service_health_status` answer different questions and both are
  # needed. `up == 0` means Prometheus cannot reach /metrics — the process is
  # gone. `service_health_status` is what the service says about itself, and a
  # process with a dead database still serves /metrics perfectly well, so `up`
  # alone would never notice it. That gap was the single most misleading thing
  # in the original alert set.
  # ===========================================================================
  - name: service_availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} is not answering scrapes'
          description: >-
            Prometheus has not been able to reach {{ $labels.job }} at
            {{ $labels.instance }} for two minutes. The process is down, or the
            network to it is.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/service-down.md'
          dashboard: 'service-overview'

      - alert: ServiceUnhealthy
        # 0 = error. The service is up and telling you it cannot do its job.
        expr: service_health_status == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: '{{ $labels.job }} reports itself unhealthy'
          description: >-
            {{ $labels.job }} is serving /metrics but its own health check
            returns `error` — a required dependency is unreachable. Check
            `service_component_up` to see which one.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/service-unhealthy.md'
          dashboard: 'service-overview'

      - alert: ServiceDegraded
        # 1 = degraded. Serving traffic, but something optional is broken —
        # for the producers, that means email is silently not being queued.
        # Nothing consumed this state before: Docker reads the 200 and calls the
        # container healthy, and `up` stays 1.
        expr: service_health_status == 1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} has been degraded for 15 minutes'
          description: >-
            {{ $labels.job }} is serving requests with an optional dependency
            down — for gpool and kini this means outbound email is not being
            queued. Users see nothing wrong, which is why this needs an alert
            rather than a dashboard.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/service-degraded.md'
          dashboard: 'service-overview'

      - alert: HealthSignalMissing
        # The health gauges are written when /health is called — every ten
        # seconds, by each container's own Docker healthcheck. That makes them a
        # dependency, and an undetected dependency failure here would silently
        # disable three alerts above: ServiceUnhealthy, ServiceDegraded and
        # ComponentDown would all stop being able to fire, and the estate would
        # look quieter than it is.
        #
        # So: a server that is being scraped but publishes no health gauge is
        # itself a problem. The job list is explicit rather than inferred,
        # because "which services are supposed to report health" is a decision,
        # and inferring it would make this alert vanish exactly when a service is
        # misconfigured.
        expr: |
          up{job=~"gpool-api|kini-api|notifications-api|cv-web|gpool-web|kini-web|sity-web|trading-bot-control-plane|trading-bot-market-data|trading-bot-execution|trading-bot-research-backtesting|trading-bot-operator-console"} == 1
          unless on (job)
          service_health_status
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is up but reports no health metric'
          description: >-
            {{ $labels.job }} is being scraped successfully but publishes no
            `service_health_status`. Its /health endpoint is not being called, or
            the handler no longer records. Until this is fixed, degraded and
            unhealthy states for this service cannot be detected.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/health-signal-missing.md'
          dashboard: 'service-overview'

      - alert: ComponentDown
        expr: service_component_up == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} cannot reach {{ $labels.component }}'
          description: >-
            The {{ $labels.component }} dependency of {{ $labels.job }} has been
            unreachable for five minutes.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/component-down.md'
          dashboard: 'service-overview'

      - alert: OpenBaoSealed
        expr: up{job="openbao"} == 1 unless on (job) (max by (job) (vault_core_unsealed) == 1)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: 'OpenBao is sealed'
          description: >-
            OpenBao is running but sealed, so it is serving no secrets. Prod
            auto-unseals through KMS, so this means the seal was migrated away,
            somebody sealed it by hand, or auto-unseal partially failed. Nothing
            breaks until something restarts: applications read their secrets at
            boot only, so running containers are unaffected and the next deploy
            or restart fails.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/openbao-sealed.md'
          dashboard: 'platform-stack'

  # ===========================================================================
  # Host and infrastructure.
  #
  # A full disk is not hypothetical here: it has taken Tolgee down twice, and
  # the second time it also broke the local database of a product stack. These
  # are the alerts that would have caught it hours earlier.
  # ===========================================================================
  - name: infrastructure
    rules:
      - alert: HostDiskFillingUp
        expr: host:filesystem_avail:ratio < 0.15
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'Less than 15% free on {{ $labels.device }}'
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} is above 85% full.
            Docker build cache and image layers are the usual cause; `docker
            builder prune -af` reclaims most of it.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/host-disk.md'
          dashboard: 'platform-host'

      - alert: HostDiskCritical
        expr: host:filesystem_avail:ratio < 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: 'Less than 5% free on {{ $labels.device }}'
          description: >-
            {{ $labels.device }} is nearly full. Postgres refuses to start when
            it cannot write, so this takes databases down, not just builds.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/host-disk.md'
          dashboard: 'platform-host'

      - alert: HostMemoryPressure
        expr: |
          (
            node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          ) < 0.10
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'Less than 10% memory available on {{ $labels.instance }}'
          description: >-
            Sustained memory pressure. ClickHouse is the first thing the kernel
            kills here, and it takes market-data and research-backtesting with
            it — neither of which has a memory limit set.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/host-memory.md'
          dashboard: 'platform-host'

      - alert: TempoMemoryNearLimit
        expr: |
          process_resident_memory_bytes{job="tempo"} / 1073741824 > 0.92
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'Tempo is holding {{ $value | humanizePercentage }} of its memory limit'
          description: >-
            Tempo is the only container in the stack with a memory limit, and
            GOMEMLIMIT keeps the Go runtime below that limit on its own. This
            fires above GOMEMLIMIT, so the runtime has already stopped holding
            its own line and what is left is the cgroup ceiling. Resident
            memory is Tempo's own figure and reads below what the kernel counts
            against the limit, so the ceiling is closer than this number looks.
            If TempoMemoryGcThrashing is quiet the growth is outside the Go
            heap; if it is firing the runtime lost and gave up.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/tempo-memory.md'
          dashboard: 'platform-stack'

      - alert: TempoMemoryGcThrashing
        expr: |
          rate(go_gc_duration_seconds_count{job="tempo"}[10m]) > 0.5
        for: 20m
        labels:
          severity: ticket
        annotations:
          summary: 'Tempo is collecting {{ $value | humanize }} times a second to stay under GOMEMLIMIT'
          description: >-
            GOMEMLIMIT is a soft limit: the runtime collects harder rather than
            growing past it, and pays for the headroom in CPU. A sustained
            collection rate means it is paying a lot, on a host with two vCPUs
            shared by everything else. The runtime caps itself at half the CPU
            and then grows past the limit anyway, so this is the warning that
            comes before TempoMemoryNearLimit, not instead of it.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/tempo-memory.md'
          dashboard: 'platform-stack'

      - alert: HostFilesystemWillFillIn24h
        # Rate of change rather than a level: catches a slow leak while there is
        # still time to act, which a threshold alone does not. A threshold tells
        # you at 85% and again at 95%, and never tells you how fast.
        expr: predict_linear(host:filesystem_avail_bytes:max[6h], 24 * 3600) < 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.device }} will be full within a day at this rate'
          description: >-
            Extrapolating the last six hours, {{ $labels.device }} runs out of
            space within 24 hours.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/host-disk.md'
          dashboard: 'platform-host'

  # ===========================================================================
  # Messaging.
  #
  # notifications consumes `notification.email.requested.v1`. A consumer that
  # has dropped out of its group fails silently — mail piles up and nothing
  # errors — which is exactly why its health check treats Kafka as required.
  # ===========================================================================
  - name: messaging
    rules:
      - alert: KafkaConsumerLagGrowing
        expr: |
          kafka:consumer_group_lag:sum > 1000
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.redpanda_group }} is {{ $value | humanize }} messages behind'
          description: >-
            Consumer lag on {{ $labels.redpanda_topic }} has been above 1000 for
            fifteen minutes. Either the consumer is slower than the producers or
            it has stopped consuming.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/kafka-lag.md'
          dashboard: 'platform-stack'

      - alert: NotificationsConsumerStuck
        expr: |
          label_replace(
            kafka:consumer_group_lag:sum{redpanda_group="notifications-api", redpanda_topic="notification.email.requested.v1"} > 0,
            "job", "notifications-api", "", ""
          )
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'notifications has left {{ $value | humanize }} emails unread for fifteen minutes'
          description: >-
            The notifications consumer group has been behind on
            notification.email.requested.v1 for fifteen minutes without ever
            catching up. Mail is waiting in Kafka and none of it is being sent.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/notifications-stalled.md'
          dashboard: 'service-notifications-api'

      - alert: NotificationsReceivedButNotSent
        expr: |
          sum by (job) (increase(notifications_received_total[30m])) > 0
          unless on (job)
          sum by (job) (increase(notifications_sent_total[30m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'notifications took emails in but sent none for thirty minutes'
          description: >-
            {{ $labels.job }} accepted emails for processing in the last thirty
            minutes and delivered none of them.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/notifications-stalled.md'
          dashboard: 'service-notifications-api'

      - alert: NotificationsDeadLetterUnread
        expr: |
          label_replace(
            kafka:consumer_group_lag:sum{redpanda_group="notifications-api", redpanda_topic="notification.email.requested.v1.DLT"} > 0,
            "job", "notifications-api", "", ""
          )
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'a dead letter has sat unread on the DLT for fifteen minutes'
          description: >-
            {{ $value | humanize }} records on
            notification.email.requested.v1.DLT are behind the notifications
            consumer group and are not being cleared. Nothing retries a dead
            letter on its own, so this will not resolve itself and the record
            will keep being re-read until someone acts on it.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/dead-letters.md'
          dashboard: 'service-notifications-api'

      - alert: DeadLetterQueueGrowing
        expr: increase(notifications_dlq_total[1h]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'Notifications are being dead-lettered'
          description: >-
            {{ $value | humanize }} notifications moved to the dead-letter topic
            in the last hour. Each one is an email a person expected and did not
            receive.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/dead-letters.md'
          dashboard: 'service-notifications-api'

      - alert: RedpandaDown
        expr: up{job="redpanda"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: 'Redpanda is not reachable'
          description: >-
            The broker every product publishes to is down. gpool and kini will
            report `degraded`; notifications will report `error`.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/redpanda-down.md'
          dashboard: 'platform-stack'

  # ===========================================================================
  # RUM. The browser half of the SLO story — a page can be perfectly available
  # from the server's point of view and unusable in the hand.
  # ===========================================================================
  - name: rum
    rules:
      - alert: CoreWebVitalsRegressed
        # p75 is the percentile Google grades Core Web Vitals on, and 2.5s is
        # the boundary between "good" and "needs improvement" for LCP.
        expr: |
          (
            label_replace(
              histogram_quantile(0.75, sum by (job, le) (rate(rum_performance_seconds_bucket{metric_name="LCP"}[6h]))) > 2.5,
              "vital", "LCP", "", ""
            )
            or
            label_replace(
              histogram_quantile(0.75, sum by (job, le) (rate(rum_performance_seconds_bucket{metric_name="INP"}[6h]))) > 0.2,
              "vital", "INP", "", ""
            )
            or
            label_replace(
              histogram_quantile(0.75, sum by (job, le) (rate(rum_layout_shift_score_bucket[6h]))) > 0.1,
              "vital", "CLS", "", ""
            )
          )
          and on (job)
          sum by (job) (rate(rum_navigations_total{navigation_type="Page View"}[6h])) * 3600 >= 20
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} {{ $labels.vital }} p75 is past the Core Web Vitals "good" threshold'
          description: >-
            For a quarter of real visits to {{ $labels.job }}, {{ $labels.vital }}
            is worse than good: past 2.5 s for LCP, 200 ms for INP or 0.1 for
            CLS, measured in browsers over six hours with at least twenty page
            views an hour.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/web-vitals.md'
          dashboard: 'rum-overview'

      - alert: RumIngestUnderAttack
        # The ingest endpoint is public and unauthenticated by necessity. This
        # is the one RUM metric whose labels the server controls, so it is the
        # only one safe to alert on.
        expr: sum by (job) (rate(rum_rejected_total{reason="rate_limited"}[5m])) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is rate-limiting RUM beacons'
          description: >-
            Sustained rejection of RUM beacons for exceeding the per-client rate
            limit. Either a client is looping, or someone is probing the endpoint.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/rum-ingest.md'
          dashboard: 'rum-overview'

      - alert: BrowserErrorsRising
        expr: |
          (
            sum by (job) (increase(rum_errors_total[1h]))
            /
            sum by (job) (increase(rum_navigations_total{navigation_type="Page View"}[1h]))
          ) > 0.1
          and on (job)
          sum by (job) (increase(rum_navigations_total{navigation_type="Page View"}[1h])) >= 20
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is throwing script errors in more than one page view in ten'
          description: >-
            Browsers reported {{ $value | humanize }} script errors per page view
            on {{ $labels.job }} over the last hour, across at least twenty page
            views. Each error is logged once as rum.client_error with the source
            line that threw it.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/browser-errors.md'
          dashboard: 'rum-overview'

      - alert: CspViolationsSeen
        expr: sum by (job, directive) (increase(csp_violations_total[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} broke its content security policy ({{ $labels.directive }})'
          description: >-
            Browsers reported {{ $value | humanize }} violations of the
            report-only policy on {{ $labels.directive }} in the last hour. Nothing
            was blocked; something ran or loaded that the policy does not allow.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/csp-violations.md'
          dashboard: 'rum-overview'

  - name: cv
    rules:
      - alert: AskSlow
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(cv_ask_latency_seconds_bucket[30m]))) > 10
          and on (job)
          sum by (job) (increase(cv_ask_latency_seconds_count[30m])) >= 5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} is taking more than ten seconds to answer questions'
          description: >-
            The 95th percentile of answer times over the last half hour is
            {{ $value | humanizeDuration }}, across at least five questions. The
            objective is 95% under ten seconds.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/ask.md'
          dashboard: 'cv-funnel'

      - alert: AskUpstreamFailing
        expr: |
          (
            sum by (job) (increase(cv_ask_requests_total{outcome="upstream_error"}[15m]))
            /
            sum by (job) (increase(cv_ask_requests_total{outcome=~"answered|refused|incomplete|upstream_error"}[15m]))
          ) > 0.5
          and on (job)
          sum by (job) (increase(cv_ask_requests_total{outcome="upstream_error"}[15m])) >= 3
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} cannot reach Claude for most questions'
          description: >-
            More than half of the questions sent to Claude in the last fifteen
            minutes failed upstream, at least three of them. Visitors see the
            answer box fail.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/ask.md'
          dashboard: 'cv-funnel'

      - alert: AskBudgetNearlySpent
        expr: max by (job) (cv_ask_budget_used_ratio) >= 0.8 < 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }} has spent {{ $value | humanizePercentage }} of this month's answer budget"
          description: >-
            The answer box closes for the rest of the month once the budget is
            spent.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/ask.md'
          dashboard: 'cv-funnel'

      - alert: AskBudgetExhausted
        expr: max by (job) (cv_ask_budget_used_ratio) >= 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }} has spent this month's answer budget"
          description: >-
            The answer box is closed until the month turns or the limit is
            raised. Questions are refused as budget_exhausted.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/ask.md'
          dashboard: 'cv-funnel'

      - alert: ContactPublishFailing
        expr: sum by (job) (increase(cv_contact_submissions_total{outcome="failed"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} could not hand {{ $value | humanize }} contact messages to the broker'
          description: >-
            Contact messages failed to publish to Kafka in the last fifteen
            minutes. The visitor saw an error and the message was not sent.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/contact-publish.md'
          dashboard: 'service-cv-web'

  - name: kini
    rules:
      - alert: PoolsSyncSchedulerDead
        expr: |
          sum by (job) (increase(kini_pools_sync_runs_total{outcome="completed"}[8d])) == 0
          and on (job)
          max by (job) (kini_pools_sync_runs_total{outcome="completed"} offset 8d)
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} has not finished a pool sync in over a week'
          description: >-
            The weekly pool sync has not completed once in eight days. Nothing
            else notices: the API is up, health is ok, and the site keeps serving
            whatever the last successful run wrote. The pools it shows are going
            stale.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/pools-sync.md'
          dashboard: 'service-kini-api'

      - alert: PoolsSyncRunFailed
        expr: sum by (job) (increase(kini_pools_sync_runs_total{outcome="failed"}[2h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} could not finish its weekly pool sync'
          description: >-
            The scheduled sync threw before it finished. kini is showing whatever
            the previous run left behind, and the next attempt is a week away
            unless someone asks for one.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/pools-sync.md'
          dashboard: 'service-kini-api'

      - alert: PoolsSyncFeedBroken
        expr: |
          sum by (job, source) (increase(kini_pools_sync_problems_total{source!="all"}[24h])) >= 3
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.source }} has given kini {{ $value | humanize }} problems in a day'
          description: >-
            One upstream feed failed to fetch, answered with nothing in it, or
            returned a document kini could not read, three or more times in the
            last day. A feed that misbehaves that often has usually changed
            shape rather than blipped.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/pools-sync.md'
          dashboard: 'service-kini-api'

      - alert: TeamInvitationsNotQueued
        expr: sum by (job) (increase(kini_notifications_total{outcome="failed"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} could not queue {{ $value | humanize }} invitation emails'
          description: >-
            Publishing a team invitation to the broker failed in the last fifteen
            minutes. The person who sent it saw an error, the invited person got
            no email, and nothing retries it.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/kini-invitations.md'
          dashboard: 'service-kini-api'

      - alert: PoolSocketOriginRefused
        expr: |
          sum by (job) (increase(kini_websocket_connections_total{outcome="rejected", reason="bad_origin"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} refused {{ $value | humanize }} socket connections from another origin'
          description: >-
            The live pool socket turned away a browser whose page was not on
            one of kini's own origins. Either a page on another site tried to
            open it with a visitor's cookies, or AUTH_CORS_ORIGINS no longer
            lists the origin kini is served from, and then every visitor has
            lost live updates.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/kini-socket.md'
          dashboard: 'service-kini-api'

      - alert: PoolSocketRefusingConnections
        expr: |
          sum by (job) (rate(kini_websocket_connections_total{outcome="rejected", reason="no_session"}[5m])) > 0.2
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} keeps refusing socket connections that carry no session'
          description: >-
            The live pool socket has refused more than one connection every
            five seconds for ten minutes because it carried no signed-in
            session. A signed-out visitor on the pools page is refused once
            and does not retry, so a steady rate is a script probing the socket
            or a client stuck in a loop.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/kini-socket.md'
          dashboard: 'service-kini-api'
  - name: gpool
    rules:
      - alert: GpoolMailPublishFailing
        expr: sum by (job) (increase(gpool_notifications_total{outcome="failed"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.job }} could not queue {{ $value | humanize }} emails'
          description: >-
            gpool failed to hand invitation or access mail to the broker in the
            last fifteen minutes. Nothing retries it, so each one is an
            invitation or a request that reaches nobody, and the person who sent
            it saw no error.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/gpool-mail.md'
          dashboard: 'gpool-funnel'

      - alert: GpoolMailRequestedButNotSent
        expr: |
          sum by (job) (increase(notifications_received_total{source_app="gpool"}[30m])) > 0
          unless on (job)
          sum by (job) (increase(notifications_sent_total{source_app="gpool"}[30m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "gpool's emails are being read and none of them sent"
          description: >-
            {{ $labels.job }} took gpool mail in over the last thirty minutes and
            delivered none of it. Mail from other products may be flowing
            normally, so nothing else alerts: a gpool template that fails to
            render looks exactly like this, and the attempts retry for hours
            before they reach the dead-letter topic.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/gpool-mail.md'
          dashboard: 'gpool-funnel'

  - name: notifications_delivery_burn
    rules:
      - alert: EmailDeliveryBudgetBurningFast
        expr: |
          (1 - slo:delivery:ratio_rate1h) > (14.4 * 0.01)
          and
          (1 - slo:delivery:ratio_rate5m) > (14.4 * 0.01)
          and
          slo:delivery_traffic:increase1h >= 3
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'notifications is late or failing on {{ $value | humanizePercentage }} of emails'
          description: >-
            Far more than one email in a hundred received in the last hour was
            not accepted by SMTP within two minutes of being requested, and
            that is still true now.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/email-delivery.md'
          dashboard: 'service-notifications-api'

      - alert: EmailDeliveryBudgetBurning
        expr: |
          (1 - slo:delivery:ratio_rate6h) > (6 * 0.01)
          and
          (1 - slo:delivery:ratio_rate30m) > (6 * 0.01)
          and
          slo:delivery_traffic:increase6h >= 3
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: 'notifications has been delivering late for hours'
          description: >-
            Over six hours, more emails missed the two-minute delivery objective
            than the monthly budget allows at this pace.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/email-delivery.md'
          dashboard: 'service-notifications-api'

      - alert: EmailDeliveryBudgetErodingSlowly
        expr: |
          (1 - slo:delivery:ratio_rate1d) > (3 * 0.01)
          and
          (1 - slo:delivery:ratio_rate2h) > (3 * 0.01)
          and
          slo:delivery_traffic:increase1d >= 3
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: 'notifications has missed the delivery objective all day'
          description: >-
            A low but steady share of emails has taken longer than two minutes
            to reach SMTP, or not reached it at all, for a day.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/email-delivery.md'
          dashboard: 'service-notifications-api'

  - name: edge
    rules:
      - alert: EdgeErrorRatioHigh
        expr: |
          (
            sum by (host) (edge:requests_5xx:rate5m)
            /
            sum by (host) (edge:requests:rate5m)
          ) > 0.05
          and
          sum by (host) (edge:requests:rate5m) > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.host }} is answering 5xx to more than 5% of requests'
          description: >-
            More than one request in twenty to {{ $labels.host }} has failed at
            the edge for ten minutes. The traffic gate means this is real
            traffic, not one request out of three.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/edge-slis.md'
          dashboard: 'platform-edge'

      - alert: EdgeLatencyHigh
        expr: |
          edge:latency_p95_seconds:5m > 2
          and on (host)
          sum by (host) (edge:requests:rate5m) > 0.05
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: '{{ $labels.host }} is slow at the edge (p95 above 2s)'
          description: >-
            The 95th percentile of requests to {{ $labels.host }}, measured
            where they arrive rather than inside the application, has been over
            two seconds for fifteen minutes.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/edge-slis.md'
          dashboard: 'platform-edge'

  - name: trading_bot
    rules:
      - alert: MarketStreamDisconnected
        expr: service_component_up{job="trading-bot-market-data", component="marketStream"} == 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'market-data has lost the Binance websocket'
          description: >-
            trading-bot-market-data has reported its market stream down for ten
            minutes. No fresh klines or trades are arriving: execution is
            evaluating stale candles, and the stored history is growing a gap
            that only a backfill will close.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/market-stream.md'
          dashboard: 'service-trading-bot-market-data'

      - alert: MarketDataProducerDisconnected
        expr: service_component_up{job="trading-bot-market-data", component="kafkaProducer"} == 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: 'market-data cannot publish to Kafka'
          description: >-
            trading-bot-market-data has reported its Kafka producer down for ten
            minutes. It may still be receiving the stream, but nothing is
            reaching execution or the control-plane projections.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/market-data-stalled.md'
          dashboard: 'service-trading-bot-market-data'

      - alert: MarketDataNotPublishing
        expr: |
          sum by (job) (increase(trading_bot_market_data_kline_publish_total[15m])) == 0
          and on (job)
          max by (job) (trading_bot_market_data_active_kline_subscriptions) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'market-data has published no klines for fifteen minutes'
          description: >-
            market-data holds kline subscriptions and has published nothing for
            fifteen minutes. Every subscription closes a candle at least once a
            minute, so silence this long is the stream, the store or the
            producer, whatever the health endpoint says about them.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/market-data-stalled.md'
          dashboard: 'service-trading-bot-market-data'

      - alert: BinanceRateLimitNearCap
        expr: |
          (
            max by (job) (trading_bot_market_data_binance_rest_used_weight_1m)
            /
            max by (job) (trading_bot_market_data_binance_rest_limit_weight_1m)
          ) > 0.9
          and
          max by (job) (trading_bot_market_data_binance_rest_limit_weight_1m) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: 'market-data has spent {{ $value | humanizePercentage }} of the Binance weight ceiling'
          description: >-
            REQUEST_WEIGHT usage has been above 90% of the configured ceiling
            for five minutes, which is past the budget the local limiter holds
            itself to. Binance answers 429 at the ceiling and bans the address
            shortly after.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/binance-rate-limit.md'
          dashboard: 'service-trading-bot-market-data'

      - alert: ExecutionLeftPaperMode
        expr: |
          trading_bot_execution_paper_mode_enabled == 0
          and on (job, instance)
          trading_bot_execution_active_promotion_loaded == 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: 'execution is trading live, not on paper'
          description: >-
            trading-bot-execution has an active promotion loaded and its mode is
            live, so every signal it acts on places a real order against the
            Binance account. Nothing else in the estate spends money on its own.
            If this was not deliberate, stop the service now.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/execution-live-mode.md'
          dashboard: 'service-trading-bot-execution'

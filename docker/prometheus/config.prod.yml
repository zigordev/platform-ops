global:
  scrape_interval: 15s
  external_labels:
    environment: prod

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'gpool-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['gpool-api:3000']
  - job_name: 'notifications-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['notifications-api:8080']
  - job_name: 'kini-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['kini-api:3000']
  - job_name: 'cv-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['cv-web:3001']
  - job_name: 'gpool-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['gpool-web:3001']
  - job_name: 'kini-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['kini-web:3001']
  # Host: disk, memory, CPU. Nothing else in the estate produces these.
  - job_name: 'node-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'openbao'
    metrics_path: /v1/sys/metrics
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['openbao:8200']
  # Redpanda's own metrics, for consumer lag and broker health.
  - job_name: 'redpanda'
    metrics_path: /public_metrics
    static_configs:
      - targets: ['platform-redpanda:9644']

  - job_name: 'caddy'
    metrics_path: /metrics
    static_configs:
      - targets: ['central-ingress:9180']
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'alertmanager'
    metrics_path: /metrics
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: 'loki'
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']
  - job_name: 'tempo'
    metrics_path: /metrics
    static_configs:
      - targets: ['tempo:3200']
  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']
  - job_name: 'otel-collector'
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8888']
  - job_name: 'alloy'
    metrics_path: /metrics
    static_configs:
      - targets: ['alloy:12345']

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/alerts.yml

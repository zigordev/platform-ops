groups:
  - name: logs
    interval: 1m
    rules:
      - alert: ErrorLogsSpiking
        expr: |
          sum by (app, environment) (
            rate({job="docker-json-logs", app=~"cv-web|gpool-api|gpool-web|kini-api|kini-web|notifications-api|sity-web|trading-bot-control-plane|trading-bot-execution|trading-bot-market-data|trading-bot-operator-console|trading-bot-research-backtesting"} | json | level = "error" [5m])
          ) > 0.2
        for: 10m
        labels:
          severity: ticket
          job: '{{ $labels.app }}'
        annotations:
          summary: '{{ $labels.app }} is writing errors continuously'
          description: >-
            {{ $labels.app }} has written more than one error line every five
            seconds for ten minutes. Read them in Grafana: {app="{{ $labels.app }}"}
            | json | level = "error".
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/error-logs.md'
          dashboard: 'service-overview'

      - alert: UncaughtExceptions
        expr: |
          sum by (app, environment) (
            count_over_time({job="docker-json-logs", app=~"cv-web|gpool-api|gpool-web|kini-api|kini-web|notifications-api|sity-web|trading-bot-control-plane|trading-bot-execution|trading-bot-market-data|trading-bot-operator-console|trading-bot-research-backtesting"} | json | event = "process.uncaught_exception" [10m])
          ) > 0
        for: 0m
        labels:
          severity: ticket
          job: '{{ $labels.app }}'
        annotations:
          summary: '{{ $labels.app }} hit an uncaught exception'
          description: >-
            {{ $labels.app }} logged an uncaught exception. A Next app keeps
            serving after one, and a Rust service loses the task that panicked
            unless it was the main one; otherwise the process exited and Docker
            restarted it.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/error-logs.md'
          dashboard: 'service-overview'

      - alert: NotificationsConsumerCrashLooping
        expr: |
          sum by (app, environment) (
            count_over_time({job="docker-json-logs", app="notifications-api"} | json | event = "kafka.consumer_crashed" [15m])
          ) > 3
        for: 5m
        labels:
          severity: ticket
          job: '{{ $labels.app }}'
        annotations:
          summary: 'the notifications consumer is crashing and restarting in a loop'
          description: >-
            The email consumer has crashed and restarted more than three times
            in fifteen minutes. The client restarts it each time, so the process
            stays up and the kafka health component is back before ComponentDown
            wants five minutes of it, while a quiet topic keeps the group lag at
            zero. Mail stops the moment somebody sends one.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/notifications-stalled.md'
          dashboard: 'service-notifications-api'

      - alert: TolgeeExportWrongShape
        expr: |
          sum by (app, environment, error_name) (
            count_over_time({job="docker-json-logs", app=~"cv-web|gpool-web|kini-web|trading-bot-operator-console"} | json | event = "i18n.fallback" | error_name =~ "FlatExport|EmptyExport" [30m])
          ) > 0
        for: 1h
        labels:
          severity: ticket
          job: '{{ $labels.app }}'
        annotations:
          summary: '{{ $labels.app }} is refusing the Tolgee export because it comes back unusable ({{ $labels.error_name }})'
          description: >-
            Tolgee answered 200 with a body {{ $labels.app }} could not use, so
            the loader threw the export away and served the copy it already had.
            FlatExport is dotted keys where the app reads a nested object, and
            means the project stopped honouring structureDelimiter=. and
            supportArrays=true. EmptyExport is a 200 carrying no messages at all
            — an archive with no JSON member, or a null body — and means the
            project stopped exporting JSON. Both are export settings on a Tolgee
            that is reachable and healthy, and nothing on the page is broken,
            which is why no health component reports this: while any process
            still holds a cached export the render counts as merged and neither
            ComponentDown nor CopyServedFromRepository fires. Every edit made in
            Tolgee is invisible until the settings are fixed. Restarting Tolgee
            re-serves the same body.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/i18n-fallback.md'
          dashboard: 'service-overview'

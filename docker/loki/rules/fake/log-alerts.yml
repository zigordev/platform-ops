groups:
  - name: logs
    interval: 1m
    rules:
      - alert: ErrorLogsSpiking
        expr: |
          sum by (app) (
            rate({job="docker-json-logs"} | json | level = "error" [5m])
          ) > 0.2
        for: 10m
        labels:
          severity: ticket
          environment: '{{ $externalLabels.environment }}'
        annotations:
          summary: '{{ $labels.app }} is writing errors continuously'
          description: >-
            {{ $labels.app }} has written more than one error line every five
            seconds for ten minutes. Read them in Grafana: {app="{{ $labels.app }}"}
            | json | level = "error".
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/error-logs.md'
          dashboard: 'service-overview'

      - alert: UncaughtExceptions
        expr: |
          sum by (app) (
            count_over_time({job="docker-json-logs"} | json | event = "process.uncaught_exception" [10m])
          ) > 0
        for: 0m
        labels:
          severity: ticket
          environment: '{{ $externalLabels.environment }}'
        annotations:
          summary: '{{ $labels.app }} hit an uncaught exception'
          description: >-
            {{ $labels.app }} logged an uncaught exception. A Next app keeps
            serving after one and a Rust service loses only the task that
            panicked; any other Node service exited and Docker restarted it.
          runbook_url: 'https://github.com/zigordev/platform-ops/blob/main/docs/runbooks/error-logs.md'
          dashboard: 'service-overview'
